<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="Author" content="Sakamoto Takashi">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>厚木マラソン</title>
		<style>
		body			{ font-size: 120%; }
		#control		{ position: absolute; top: 5px; left:   5px; z-index: 1; }
		#canvas			{ position: absolute; top: 0px; left:   0px; z-index: 0; }
		button			{ font-size: 90%; margin-left: 15px; }
		input			{ margin-left: 10px; margin-right: 7px; }
		#iSpeed			{ width: 100%; }
		</style>
		<script type="importmap">
		{
		  "imports": {
			"three": "https://unpkg.com/three@0.164.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
		  }
		}
		</script>
	</head>
	<body>
		<div id="control">
			<span style="display: inline-block; width: 500px;"><input id="iSpeed" type="range" min="0" max="20" step="1" value="0"></span>
		</div>
		<div id="canvas" style="width: 100%; height: 100%;"></div>
		<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

		function getCurveXZ(pathStr) {
			function getVector3(ary, index) { return new THREE.Vector3(Number(ary[index]), 0, Number(ary[index+1])); }
			let elem = pathStr.match(/[A-Za-z]|-?\d+(\.\d+)?/g);
			if (elem.length == 0) { throw new Error(); }
			const curve = new THREE.CurvePath();
			let index = 0;
			const ssp = new THREE.Vector3(0, 0, 0);
			let sp = ssp; 
			while (index < elem.length) {
				let token = elem[index++];
				switch (token) {
					case 'M': {
						if (index + 2 > elem.length) { throw new Error(); }
						sp = getVector3(elem, index);
						index += 2;
					}
					break;
					
					case 'L': {
						if (index + 2 > elem.length) { throw new Error(); }
						const ep = getVector3(elem, index);
						curve.add(new THREE.LineCurve3(sp, ep));
						sp = ep;
						index += 2;
					}
					break;
						
					case 'Q': {
						if (index + 4 > elem.length) { throw new Error(); }
						const ep = getVector3(elem, index+2);
						curve.add(new THREE.QuadraticBezierCurve3(sp, getVector3(elem, index), ep));
						sp = ep;
						index += 4;
					}
					break;
						
					case 'C': {
						if (index + 6 > elem.length) { throw new Error(); }
						const ep  = getVector3(elem, index+4);
						curve.add(new THREE.CubicBezierCurve3(sp, getVector3(elem, index), getVector3(elem, index+2), ep));
						sp = ep;
						index += 6;
					}
					break;
						
					case 'Z':
						curve.add(new THREE.LineCurve3(sp, ssp));
						break;
					
					default:
						console.log('ignore: ' + token);
						break;
				}
			}
			return curve;
		}
	
		const canvas = document.querySelector('#canvas');
		const iSpeed = document.getElementById('iSpeed');
		function getWidth()  { return canvas.getBoundingClientRect().width; }
		function getHeight() { return canvas.getBoundingClientRect().height; }

		const COURSE = getCurveXZ('M 115,54 C 122,45 110,40 109,41 C 105,44 98,52 101,56 C 104,61 112,64 117,59 C 122,53 122,48 120,46 C 112,36 107,43 104,42 C 102,42 100,30 99,30 C 96,30 78,39 76,53 C 75,60 75,63 68,70 C 65,73 67,86 64,89 C 63,90 24,115 22,118 C 18,125 23,129 22,133 C 17,152 34,148 37,154 C 39,158 37,161 48,163 C 53,164 60,167 63,167 C 65,167 100,162 115,167 C 133,173 151,181 152,180 C 155,176 151,156 155,152 C 159,148 151,144 167,144 C 176,144 192,147 198,142 C 200,141 210,141 216,141 C 219,141 224,145 226,143 C 232,137 252,148 252,137 C 252,131 234,126 235,122 C 239,104 231,111 231,106 C 231,101 235,101 230,96 C 227,93 202,56 200,51 C 198,46 178,10 176,10 C 168,7 156,20 133,5 C 130,3 120,9 120,10 C 120,13 125,11 125,25 C 125,29 126,35 127,36 C 134,39 150,32 154,29 C 156,28 159,32 156,32 C 153,32 144,37 139,38 C 134,40 127,38 127,39 C 125,42 128,42 122,50 C 121,51 122,55 116,60 C 112,62 110,67 107,70 C 105,73 101,77 97,74 C 95,72 92,67 92,65 C 92,63 97,54 99,54 C 100,54 103,61 107,61 C 119,61 122,48 120,46 C 118,44 115,40 112,40 C 110,40 112,44 108,49 C 105,52 103,56 107,58 C 109,60 112,57 115,53 C 119,48 112,45 111,46 C 110,47 107,51 106,53');

		const UP_DOWN = getCurveXZ('M 5,16 C 7,16 20,16 20,16 C 22.25,15.5 22.5,15.5 23,16 C 24,17 25,15 27,15 C 28,15 29,18 31,16 C 32,15 33,15 37,14 C 38,13 38,10 39,9 C 43,4 44,7 45,10 C 46,12 48,14 49,14 C 50,14 52,18 54,18 C 55,18 55,15 59,17 C 63,19 64,13 66,13 C 67,13 71,16 72,16 C 73,16 73,16 75,16 C 74,16 74.93,16 74.96,16 C 76,16 75,14 76,14 C 77,14 78,20 79,20 C 85,20 86,20 89,17 C 90,16 99,18 102,19 C 103,19 105,18 107,16 C 109,14 111,14 114,15 C 115,15 117,17 118,16 C 119,15 120,15 121.2,16 C 122,17 122,17 123,16 C 123.5,15.5 123.5,15.5 142,16 C 138,16 167,16 167,16');
		
		function getRoadGeometry() {
			const radialSegments = 8;
			const g = new THREE.TubeGeometry(COURSE, 1000, 1, radialSegments);
			const positions = g.attributes.position.array;
			for (let i = 0; i < positions.length; i += 3*(radialSegments+1)) {
				const h = UP_DOWN.getPoint(i/positions.length);
				for (let j = 0; j < 3*(radialSegments+1); j += 3) {
					const y = positions[i+j+1];
					positions[i+j+1] = (y > 0.1)?(21-h.z)*2+15:(Math.abs(y) < 0.1)?15:0;
				}
			}
			g.computeVertexNormals();
			g.attributes.position.needsUpdate = true;
			return g;
		}
		
		function setPosition(obj, pos) {
			const p = COURSE.getPoint(pos);
			const h = UP_DOWN.getPoint(pos);
			obj.position.set(p.x, (21-h.z)*2+15, p.z);
			
			const tangent = new THREE.Vector3();
			const defaultAxis = new THREE.Vector3(0, 0, 1);
			COURSE.getTangentAt(pos, tangent);
			obj.quaternion.setFromUnitVectors(defaultAxis, tangent);
		}

		class Person {
			createArm1(material) {
				const g = new THREE.Group();
				const m0 = new THREE.Mesh(new THREE.SphereGeometry(0.10), material);
				const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.3), material);
				m1.position.set(0, -0.15, 0);
				const m2 = new THREE.Mesh(new THREE.SphereGeometry(0.12), material);
				m2.position.set(0, -0.30, 0);
				g.add(m0, m1, m2);
				return g;
			}
			createArmL(material) {
				const g = new THREE.Group();
				const m0 = new THREE.Mesh(new THREE.SphereGeometry(0.10), material);
				const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.3), material);
				m1.position.set(0, -0.15, 0);
				this.armL1 = this.createArm1(material);
				this.armL1.position.set(0, -0.3, 0);
				g.add(m0, m1, this.armL1);
				return g;
			}
			createArmR(material) {
				const g = new THREE.Group();
				const m0 = new THREE.Mesh(new THREE.SphereGeometry(0.10), material);
				const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.3), material);
				m1.position.set(0, -0.15, 0);
				this.armR1 = this.createArm1(material);
				this.armR1.position.set(0, -0.3, 0);
				g.add(m0, m1, this.armR1);
				return g;
			}
			createLeg1(material) {
				const g = new THREE.Group();
				const m0 = new THREE.Mesh(new THREE.SphereGeometry(0.12), material);
				const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.36), material);
				m1.position.set(0, -0.18, 0);
				const m2 = new THREE.Mesh(new THREE.SphereGeometry(0.15), material);
				m2.scale.set(1, 0.5, 1.3);
				m2.position.set(0, -0.36, 0);
				m2.position.set(0, -0.36, 0.03);
				g.add(m0, m1, m2);
				return g;
			}
			createLegL(material) {
				const g = new THREE.Group();
				const m0 = new THREE.Mesh(new THREE.SphereGeometry(0.13), material);
				const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.12, 0.36), material);
				m1.position.set(0, -0.18, 0);
				this.LegL1 = this.createLeg1(material);
				this.LegL1.position.set(0, -0.36, 0);
				g.add(m0, m1, this.LegL1);
				return g;
			}
			createLegR(material) {
				const g = new THREE.Group();
				const m0 = new THREE.Mesh(new THREE.SphereGeometry(0.13), material);
				const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.12, 0.36), material);
				m1.position.set(0, -0.18, 0);
				this.LegR1 = this.createLeg1(material);
				this.LegR1.position.set(0, -0.36, 0);
				g.add(m0, m1, this.LegR1);
				return g;
			}
			constructor(material, speed) {
				this.person = new THREE.Group();
				
				this.sphere = new THREE.SphereGeometry(1);
				this.all = new THREE.Group();
				this.head = new THREE.Mesh(new THREE.SphereGeometry(0.18), material);				this.head.scale.set(0.9,1,0.9);
				this.head.position.y = 0.88;
				this.body = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.7), material);	this.body.scale.set(1,1,0.5);
				this.body.position.y = 0.35;
				this.waist = new THREE.Mesh(new THREE.SphereGeometry(0.30), material);				this.waist.scale.set(1,0.3,0.5);
				this.waist.position.y = 0;
				this.armL = this.createArmL(material);
				this.armL.position.set( 0.4, 0.62, 0);
				this.armR = this.createArmR(material);
				this.armR.position.set(-0.4, 0.62, 0);
				this.legL = this.createLegL(material);
				this.legL.position.set( 0.14, -0.1, 0);
				this.legR = this.createLegR(material);
				this.legR.position.set(-0.14, -0.1, 0);
				this.all.add(this.head, this.body, this.waist, this.armL, this.armR, this.legL, this.legR);
				this.all.position.y = 0.75;
				this.person.add(this.all);
				this.speed = speed;
				this.pos = 0;
				setPosition(this.person, this.pos);
			}
			getObject() { return this.person; }
			animate() {
				if (this.pos >= 1) { return; }
				const speed = this.speed*Number(iSpeed.value);
				if (speed === 0) {
					this.all.rotation.x = 0;
					this.armL1.rotation.x = 0;
					this.armR1.rotation.x = 0;
					this.LegL1.rotation.x = 0;
					this.LegR1.rotation.x = 0;
					this.armL.rotation.x =  0;
					this.armR.rotation.x =  0;
					this.legL.rotation.x =  0;
					this.legR.rotation.x =  0;
					return;
				}
				this.all.rotation.x = speed*60;
				this.armL1.rotation.x = -Math.PI/2;
				this.armR1.rotation.x = -Math.PI/2;
				this.LegL1.rotation.x = 1;
				this.LegR1.rotation.x = 1;
				this.pos = Math.min(this.pos+speed/20, 1);
				const delta = Math.sin(this.pos*2000*Math.PI);
				this.armL.rotation.x =  delta;
				this.armR.rotation.x = -delta;
				this.legL.rotation.x = -delta;
				this.legR.rotation.x =  delta;
				setPosition(this.person, this.pos);
			}
		}
		
		const scene = new THREE.Scene();

		const [TEXTURE_WIDTH, TEXTURE_HEIGHT] = [2048, 512]; 
		const texture_canvas = document.createElement('canvas');
		texture_canvas.width = TEXTURE_WIDTH;
		texture_canvas.height = TEXTURE_HEIGHT;
		const texture = new THREE.CanvasTexture(texture_canvas);
		function updateCanvas(canvas) {
			const ctx = canvas.getContext('2d');
			ctx.fillStyle = '#604020';
			ctx.fillRect(0, 0, TEXTURE_WIDTH, TEXTURE_HEIGHT);
			ctx.font = 'bold 40px sans-serif';
			ctx.fillStyle = '#000';
			ctx.fillText('厚木マラソン', 566, 182); 
			ctx.font = 'bold 22px sans-serif';
			ctx.fillText('2026年 10月 25日', 890, 187);
			ctx.font = '12px sans-serif';
			ctx.fillText('© CoderDojo厚木', 220, 190);

			ctx.beginPath();
			ctx.strokeStyle = '#ffffff';
			ctx.lineWidth = 0.5;
			for (let i = 0; i < 10; ++i) {
				ctx.moveTo(i*TEXTURE_WIDTH/10, TEXTURE_HEIGHT/2);
				ctx.lineTo(i*TEXTURE_WIDTH/10, TEXTURE_HEIGHT);
				ctx.save();
				ctx.translate(i*TEXTURE_WIDTH/10, 330);
				ctx.rotate(Math.PI);
				ctx.textAlign = 'center'
				ctx.fillStyle = '#fff';
				ctx.font = '18px sans-serif';
				ctx.fillText(`${i+1}km`, 0, 0);
				ctx.restore();
			}
//			ctx.moveTo(0,128);
//			ctx.lineTo(TEXTURE_WIDTH,128)
			ctx.stroke();
		}
		updateCanvas(texture_canvas);

		const directionLight = new THREE.DirectionalLight(0xffffff, 3);
		directionLight.position.set(1,1,1);
		scene.add(directionLight);
		const ambientLight = new THREE.AmbientLight(0x999999, 2);
		scene.add(ambientLight);

		const geoRoad = getRoadGeometry();
		const matRoad = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.6, map: texture});
		const road = new THREE.Mesh(geoRoad, matRoad);
		scene.add(road);
		const base = new THREE.Mesh(new THREE.BoxGeometry(300, 6, 220), new THREE.MeshStandardMaterial({color: 0x202020}));
		base.position.set(130, -3, 90);
		scene.add(base);

		const persons = [];
		const NUMBER = 100;
		for (let i = 0; i < NUMBER; ++i) {
			const speed = Math.random()*0.0003 + 0.0003;
			const color = Math.floor(Math.random()*0x1000000);
			const p = new Person(new THREE.MeshStandardMaterial({color: color}), speed);
//			p.getObject().scale.set(60,60,60);
			persons.push(p);
			scene.add(p.getObject());
		}
		
		const camera = new THREE.PerspectiveCamera(50, getWidth()/getHeight(), 1, 5000);
		camera.position.set(130, 80, 400);
		const renderer = new THREE.WebGLRenderer();
		renderer.setSize(getWidth(), getHeight());
		renderer.setClearColor(0xa0a0ff);
		renderer.shadowMap.enabled = true;
		const controls = new OrbitControls(camera, renderer.domElement);
		Object.assign(controls, {rotateSpeed: 0.5, enableDamping: true, dampingFactor: 0.05});
		canvas.appendChild(renderer.domElement);
		controls.target.set(130, 20, 120);
		controls.update();
		
		function animate() {
			renderer.setSize(getWidth(), getHeight());
			persons.forEach((p) => p.animate());
			renderer.render(scene, camera);
			requestAnimationFrame(animate);
		}

		animate();
		</script>
	</body>
</html>
