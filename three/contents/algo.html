		class Scheduler {
			setScenario(scenario) {
				this.scenario = scenario;
				this.index = -1;
			}
			setListener(listener) { this.listener = listener; }
			isRunning() { return this.index >= 0; }
			getDiffPattern(target, source) {
				const result = [];
				target.forEach((elem1) => {
					const elem2 = source.find(item => item.name === elem1.name);
					result.push(Object.fromEntries(Object.keys(elem1).map(key => [key, (typeof elem1[key] === 'number')?(elem1[key]-elem2[key]):elem1[key]])));
				});
				return result;
			}
			getDiffPatterns(targets, sources) {
				const results = [];
				for (let i = 0; i < targets.length; ++i) { results.push(this.getDiffPattern(targets[i], sources[i])); }
				return results;
			}
			setIndex(no) {
				this.index = no;
				this.listener?.('index', this.index);
				if (this.index < 0) { return; }
				this.pattern		= this.scenario[this.index].pattern;
				this.durationTime	= Math.max(1, Math.floor(this.scenario[this.index].duration * 2**this.scale));
				this.waitTime		= Math.max(0, Math.floor(this.scenario[this.index].wait * 2**this.scale));
				this.diffPattern	= (this.scenario[this.index].pattern.every(Array.isArray))
					?this.getDiffPatterns(this.scenario[this.index].pattern, this.object.getAllParameter())
					:this.getDiffPattern(this.scenario[this.index].pattern, this.object.getAllParameter())
				this.diffDuration	= this.durationTime;
			}
			setScale(scale) { this.scale = scale; }
			run(no) {
				this.setIndex(no);
				this.scale = 0;
				this.pausing = false;
			}
			next() {
				let next = -1;
				for (let i = this.index+1; i < this.scenario.length; ++i) {
					if (this.scenario[i].checked) { next = i; break; }
				}
				this.setIndex(next);
			}
			stop() { this.setIndex(-1); }
			pause() { this.pausing = !this.pausing; }
			constructor(object) {
				this.object = object;
				this.scale = 0;
				this.pausing = false;
			}
			animate() {
				if (!this.isRunning() || this.pausing) { return; }
				if (this.durationTime > 0) {
					--this.durationTime;
					if (this.durationTime == 0)	{ this.object.setAllParameter(this.pattern); }
					else						{ this.object.addAllParameter(this.diffPattern, 1/this.diffDuration); }
					this.listener?.('object');
				}
				else if (this.waitTime > 0) { --this.waitTime; }
				else if (this.waitTime == 0) { this.next(); }
			}
		}
		
		class Animatable {
			getPart(name) { throw new Error('getPart(name) must be implemented'); }
			getObject() { throw new Error('getObject() must be implemented');  }
			getObjectName() { throw new Error('getObjectName() must be implemented'); }

			move(part, command, delta) {
				switch (command) {
				case 'MX': this.getObject().position.x = delta/100; return;
				case 'MY': this.getObject().position.y = delta/100; return;
				case 'MZ': this.getObject().position.z = delta/100; return;
				}
			}
			movePart(partName, command, delta) {
				const part = this.getPart(partName);
				if (part === null) { return; }
				switch (command) {
				case 'RX': part.rotation.x = delta/180*Math.PI; return;
				case 'RY': part.rotation.y = delta/180*Math.PI; return;
				case 'RZ': part.rotation.z = delta/180*Math.PI; return;
				}
			}
			getPartParameter(partName) {
				const part = this.getPart(partName);
				if (part === null) { return null; }
				return {name: partName, rx: part.rotation.x/Math.PI*180, ry: part.rotation.y/Math.PI*180, rz: part.rotation.z/Math.PI*180};
			}
			getMoveParameter() { return {name: this.getObjectName(), mx: this.getObject().position.x*100, my: this.getObject().position.y*100, mz: this.getObject().position.z*100}; }
			getAllParameter() {
				const data = [];
				for (let i = 0; i < this.data.length; ++i) {
					const label = this.data[i].label;
					data.push(this.getPartParameter(label));
				}
				data.push(this.getMoveParameter());
				return data;
			}
			setAllParameter(param) {
				param.forEach((data) => {
					if (data.name === this.getObjectName()) {
						this.getObject().position.set(data.mx/100, data.my/100, data.mz/100);
					}
					else {
						const part = this.getPart(data.name);
						if (part !== null) { part.rotation.set(data.rx/180*Math.PI, data.ry/180*Math.PI, data.rz/180*Math.PI); }
					}
				});
			}
			getAllParameterDiff(param) {
				const result = [];
				param.forEach((data) => {
					if (data.name === this.getObjectName()) {
						result.push({name: data.name, mx: data.mx/100 - this.getObject().position.x, my: data.my/100 - this.getObject().position.y, mz: data.mz/100 - this.getObject().position.z});
					}
					else {
						const part = this.getPart(data.name);
						if (part !== null) { result.push({name: data.name, rx: data.rx/180*Math.PI - part.rotation.x, ry: data.ry/180*Math.PI - part.rotation.y, rz: data.rz/180*Math.PI - part.rotation.z}); }
					}
				});
				return result;
			}
			addAllParameter(param, delta) {
				param.forEach((data) => {
					if (data.name === this.getObjectName()) {
						this.getObject().position.set(this.getObject().position.x + data.mx/100*delta, this.getObject().position.y + data.my/100*delta, this.getObject().position.z + data.mz/100*delta);
					}
					else {
						const part = this.getPart(data.name);
						if (part !== null) { part.rotation.set(part.rotation.x + data.rx/180*Math.PI*delta, part.rotation.y + data.ry/180*Math.PI*delta, part.rotation.z + data.rz/180*Math.PI*delta); }
					}
				});
			}
		}

			constructor(id = null, skin = null, shirt = null, pants = null, shoes = null) {
				super();
				this.NAME_HEAD			= ((id == null)?'':id+':') + 'head';
				this.NAME_BODY			= ((id == null)?'':id+':') + 'body';
				this.NAME_WAIST			= ((id == null)?'':id+':') + 'waist';
				this.NAME_LEFTARM		= ((id == null)?'':id+':') + 'leftArm';
				this.NAME_LEFTFOREARM	= ((id == null)?'':id+':') + 'leftForearm';
				this.NAME_LEFTHAND		= ((id == null)?'':id+':') + 'leftHand';
				this.NAME_RIGHTARM		= ((id == null)?'':id+':') + 'rightArm';
				this.NAME_RIGHTFOREARM	= ((id == null)?'':id+':') + 'rightForearm';
				this.NAME_RIGHTHAND		= ((id == null)?'':id+':') + 'rightHand';
				this.NAME_LEFTLEG		= ((id == null)?'':id+':') + 'leftLeg';
				this.NAME_LEFTFORELEG	= ((id == null)?'':id+':') + 'leftForeleg';
				this.NAME_LEFTFOOT		= ((id == null)?'':id+':') + 'leftFoot';
				this.NAME_RIGHTLEG		= ((id == null)?'':id+':') + 'rightLeg';
				this.NAME_RIGHTFORELEG	= ((id == null)?'':id+':') + 'rightForeleg';
				this.NAME_RIGHTFOOT		= ((id == null)?'':id+':') + 'rightFoot';
				this.NAME				= ((id == null)?'':id+':') + 'doll';
				
				this.data = [
					{label: this.NAME_HEAD},		{label: this.NAME_BODY},			{label: this.NAME_WAIST},
					{label: this.NAME_LEFTARM},		{label: this.NAME_LEFTFOREARM},		{label: this.NAME_LEFTHAND},
					{label: this.NAME_RIGHTARM},	{label: this.NAME_RIGHTFOREARM},	{label: this.NAME_RIGHTHAND},
					{label: this.NAME_LEFTLEG},		{label: this.NAME_LEFTFORELEG},		{label: this.NAME_LEFTFOOT},
					{label: this.NAME_RIGHTLEG},	{label: this.NAME_RIGHTFORELEG},	{label: this.NAME_RIGHTFOOT},
				];
				
				this.skin  = skin  ?? new THREE.MeshStandardMaterial({color: 0xddaa88});
				this.shirt = shirt ?? new THREE.MeshStandardMaterial({color: 0xee3030});

				this.waist.position.y = 0.87;
				this.doll.add(this.waist);
				this.object = this.doll;

			getPart(name) {
				switch (name) {
				case this.NAME_HEAD:			return this.head;
				case this.NAME_BODY:			return this.body;
				case this.NAME_WAIST:			return this.waist;
				case this.NAME_LEFTARM:			return this.leftArm;
				case this.NAME_LEFTFOREARM:		return this.leftForearm;
				case this.NAME_LEFTHAND:		return this.leftHand;
				case this.NAME_RIGHTARM:		return this.rightArm;
				case this.NAME_RIGHTFOREARM:	return this.rightForearm;
				case this.NAME_RIGHTHAND:		return this.rightHand;
				case this.NAME_LEFTLEG:			return this.leftLeg;
				case this.NAME_LEFTFORELEG:		return this.leftForeleg;
				case this.NAME_LEFTFOOT:		return this.leftFoot;
				case this.NAME_RIGHTLEG:		return this.rightLeg;
				case this.NAME_RIGHTFORELEG:	return this.rightForeleg;
				case this.NAME_RIGHTFOOT:		return this.rightFoot;
				}
				return null;
			}
			getObject() { return this.doll; }
			getObjectName() { return this.NAME; }
		}
		
		class Setting {
			constructor() {
				this.ids = ['A', 'B'];
				const doll1 = new Doll(this.ids[0], null, new THREE.MeshStandardMaterial({color: 0xff0000}), null, null);
				doll1.getObject().position.set(-0.36, 0, 0);
				const doll2 = new Doll(this.ids[1], null, new THREE.MeshStandardMaterial({color: 0x0000ff}), null, null);
				doll2.getObject().position.set( 0.36, 0, 0);
				this.object = new THREE.Group();
				this.object.add(doll1.getObject(), doll2.getObject());
				this.characters = [doll1, doll2];
			}
			size() { return this.ids.length; }
			getObject() { return this.object; }
			getId(partName)						{ return (partName != null)?partName.substring(0, partName.indexOf(':')):this.ids[0]; }
			move(partName, command, delta)		{ this.characters[this.ids.indexOf(this.getId(partName))].move(partName, command, delta); }
			movePart(partName, command, delta)	{ this.characters[this.ids.indexOf(this.getId(partName))].movePart(partName, command, delta); }
			getPartParameter(partName)			{ return this.characters[this.ids.indexOf(this.getId(partName))].getPartParameter(partName); }
			getMoveParameter(partName)			{ return this.characters[this.ids.indexOf(this.getId(partName))].getMoveParameter(); }
			getAllParameter() {
				const ret = [];
				this.characters.forEach((doll) => ret.push(doll.getAllParameter()));
				return ret;
			}
			setAllParameter(param) {
				for (let i = 0; i < this.characters.length; ++i) { this.characters[i].setAllParameter(param[i]); }
			}
			addAllParameter(param, delta) {
				for (let i = 0; i < this.characters.length; ++i) { this.characters[i].addAllParameter(param[i], delta); }
			}
		}

		let playScale = 0;

		const scene = new THREE.Scene();
		function addLights(scene) {
			const directionLight = new THREE.DirectionalLight(0xffffff, 3);
			directionLight.position.set(1,1,1);
			scene.add(directionLight);
			const ambientLight = new THREE.AmbientLight(0x999999, 2);
			scene.add(ambientLight);
		}
		addLights(scene);
		
		const setting = new Setting();
		scene.add(setting.getObject());

		const scheduler = new Scheduler(setting);
		
		const ground = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 8), new THREE.MeshStandardMaterial({color: 0x806020}));
		ground.position.y = -0.05;
		scene.add(ground);
		
		const camera = new THREE.PerspectiveCamera(60, getWidth()/getHeight(), 0.1, 1000);
		camera.layers.enable(1);
		camera.position.set(0, 1, 3);
		const renderer = new THREE.WebGLRenderer();
		renderer.setSize(getWidth(), getHeight());
		renderer.setClearColor(0xa0a0ff);
		
		const controls = new OrbitControls(camera, renderer.domElement);
		Object.assign(controls, {rotateSpeed: 0.5, enableDamping: true, dampingFactor: 0.05});
		controls.target.set(0,0.7,0);
		canvas.appendChild(renderer.domElement);
		controls.update();
		
		window.addEventListener("resize", () => {
			camera.aspect = getWidth() / getHeight();
			camera.updateProjectionMatrix();
			renderer.setSize(getWidth(), getHeight());
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.render(scene, camera);
		});

		document.getElementById('play').addEventListener('click', () => {
			scheduler.setScenario(_scenario);
			playScale = 0;
			scheduler.run(0);
		});
		document.getElementById('fast').addEventListener('click', () => {
			playScale = Math.max(-2, playScale-1);
			scheduler.setScale(playScale);
		});
		document.getElementById('slow').addEventListener('click', () => {
			playScale = Math.min(2, playScale+1);
			scheduler.setScale(playScale);
		});
		document.getElementById('pause').addEventListener('click', () => {
			scheduler.pause();
		});
		document.getElementById('stop').addEventListener('click', () => {
			scheduler.stop();
		});
		document.getElementById('ng').addEventListener('click', () => {
			scheduler.setScenario(_scenario_ng);
			scheduler.setScale(0);
			scheduler.run(0);
		});
		

		function animate() {
			renderer.setSize(getWidth(), getHeight());
			renderer.render(scene, camera);
			
			scheduler.animate();
			
			requestAnimationFrame(animate);
		}

		animate();
		</script>
	</body>
</html>
