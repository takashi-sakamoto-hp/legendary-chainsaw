<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<title>万華鏡？</title>
		<style>
			#canvas  { position: absolute; top: 0px; left: 0px; z-index: 0; }
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.164.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<canvas id="canvas"></canvas>

		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			const canvas = document.getElementById("canvas");
			const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x888888);

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
			camera.position.set(0, 0, 8);
			camera.lookAt(0, 0, 0);

			resize();

			const directionLight = new THREE.DirectionalLight(0xffffff, 3);
			directionLight.position.set(1, 1, 1);
			directionLight.target.position.set(0, 0, 0);
			scene.add(directionLight);
			const ambientLight = new THREE.AmbientLight(0x999999, 1);
			scene.add(ambientLight);

			const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x00ffff }));
			box.position.set(1, 1, 1);
			scene.add(box);
			const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({ color: 0xffff00 }));
			sphere.position.set(-1, -1, -1);
			scene.add(sphere);
			const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3), new THREE.MeshStandardMaterial({ color: 0xff00ff }));
			cylinder.position.set(-1, -1, 0.5);
			scene.add(cylinder);
			const cone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
			cone.position.set(-1, 0.5, -0.5);
			scene.add(cone);
			const torus = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
			torus.position.set(-1, -0.5, -1.5);
			scene.add(torus);
			const tetrahedron = new THREE.Mesh(new THREE.TetrahedronGeometry(0.4), new THREE.MeshStandardMaterial({ color: 0x00ff00 }));
			tetrahedron.position.set(-1, -0.5, 1.5);
			scene.add(tetrahedron);
			
			class Mirror {
				#rtWidth;
				#rtHeight;
				#render;
				#camera;
				#mirror;
				getRender() { return this.#render; }
				getCamera() { return this.#camera; }
				getMirror() { return this.#mirror; }
				update(renderer, scene) {
					this.#mirror.visible = false;
					renderer.setRenderTarget(this.#render);
					renderer.setViewport(0, 0, this.#rtWidth, this.#rtHeight);
					renderer.render(scene, this.#camera);
					this.#mirror.visible = true;
				}
				constructor(width, height, x, y, z, rx, ry, rz, tx = 0, ty = 0, tz = 0, rtWidth = 1024, rtHeight = 1024) {
					this.#rtWidth = rtWidth;
					this.#rtHeight = rtHeight;
					this.#render = new THREE.WebGLRenderTarget(rtWidth, rtHeight);
					this.#camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
					this.#camera.position.set(x, y, z);
					this.#camera.lookAt(tx, ty, tz);
					this.#mirror = new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({color: 0xffffff, map: this.#render.texture}));
					this.#mirror.scale.x = -1;
					this.#mirror.rotation.set(rx, ry, rz);
					this.#mirror.position.set(x, y, z);
				}
			}
			const mirrors = [];
			
			mirrors.push(new Mirror(6, 6,	 3,  0,  0,	         0, -Math.PI/2, 0));
			mirrors.push(new Mirror(6, 6,   -3,  0,  0,	         0,  Math.PI/2, 0));
			mirrors.push(new Mirror(6, 6,    0,  3,  0,	 Math.PI/2,          0, 0));
			mirrors.push(new Mirror(6, 6,    0, -3,  0,	-Math.PI/2,          0, 0));
			mirrors.push(new Mirror(6, 6,    0,  0, -3,	         0,          0, 0));
			mirrors.push(new Mirror(6, 6,    0,  0,  3,	   Math.PI,          0, 0));

			mirrors.forEach((mirror) => scene.add(mirror.getMirror()));
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 0.1, 0);
			controls.update();

			function render(time) {
				time *= 0.001;

				box.rotation.x = time * 0.7;
				box.rotation.y = time * 1.0;
				box.position.x = Math.sin(time*0.7)*2.5;
				
				sphere.position.x = Math.sin(time)*2.5;
				sphere.position.y = Math.sin(time)*2.5;
				
				cylinder.rotation.x = time * 0.8;
				cylinder.rotation.y = time * 1.1;
				cylinder.position.y = Math.sin(time*0.9)*2.5;
				
				cone.rotation.x = time * 0.3;
				cone.position.x = -Math.sin(time*0.5)*2.5;
				
				torus.rotation.x = time * 1.3;
				torus.position.x = -Math.sin(time*0.5)*2.5;

				tetrahedron.rotation.x = time * 1.5;
				tetrahedron.rotation.y = time * 1.2;
				tetrahedron.position.x = -Math.sin(time*0.7)*2.5;
				tetrahedron.position.y = -Math.sin(time*1.1)*2.5;
				
				mirrors.forEach((mirror) => mirror.update(renderer, scene));

				renderer.setRenderTarget(null);
				renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
				renderer.render(scene, camera);

				requestAnimationFrame(render);
			}
			requestAnimationFrame(render);

			window.addEventListener("resize", resize);
			function resize() {
				const w = window.innerWidth;
				const h = window.innerHeight;
				renderer.setSize(w, h, false);
				camera.aspect = w / h;
				camera.updateProjectionMatrix();
			}
		</script>
	</body>
</html>
