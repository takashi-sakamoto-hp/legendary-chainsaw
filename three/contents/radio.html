				this.scale = 0;
				this.pausing = false;
			}
			next() {
				let next = -1;
				for (let i = this.index+1; i < this.scenario.length; ++i) {
					if (this.scenario[i].checked) { next = i; break; }
				}
				this.setIndex(next);
			}
			stop() { this.setIndex(-1); }
			pause() { this.pausing = !this.pausing; }
			constructor(object) {
				this.object = object;
				this.scale = 0;
				this.pausing = false;
			}
			animate() {
				if (!this.isRunning() || this.pausing) { return; }
				if (this.durationTime > 0) {
					--this.durationTime;
					if (this.durationTime == 0)	{ this.object.setAllParameter(this.pattern); }
					else						{ this.object.addAllParameter(this.diffPattern, 1/this.diffDuration); }
					this.listener?.('object');
				}
				else if (this.waitTime > 0) { --this.waitTime; }
				else if (this.waitTime == 0) { this.next(); }
			}
		}

			createTextureFace() {
				const canvas = document.createElement('canvas');
				canvas.width = 512;
				canvas.height = 256;
				const ctx = canvas.getContext('2d');
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				ctx.beginPath();
				ctx.ellipse(100, 128, 17, 10, 0, 0, Math.PI*2);
				ctx.ellipse(156, 128, 17, 10, 0, 0, Math.PI*2);
				ctx.fillStyle = '#202020';
				ctx.fill();

				ctx.beginPath();
				ctx.ellipse(128, 160, 40, 30, 0, 0.3, Math.PI-0.3);
				ctx.fillStyle = '#ff2020';
				ctx.fill();
				
				ctx.beginPath();
				ctx.moveTo(  0,   0);
				ctx.lineTo(  0, 150);
				ctx.lineTo(100,  85);
				ctx.lineTo(156, 100);
				ctx.lineTo(256, 130);
				ctx.lineTo(384, 210);
				ctx.lineTo(512, 150);
				ctx.lineTo(512,   0);
				ctx.closePath();
				ctx.fillStyle = '#202020';
				ctx.fill();

				const texture = new THREE.CanvasTexture(canvas);
				return texture;
			}

				this.sphere = new THREE.SphereGeometry(1);
				this.all = new THREE.Group();
				this.waist = this.createWaist();
				this.waist.position.y = 0.87;
				this.doll.add(this.waist);
			}

			getPart(name) {
				switch (name) {
				case this.NAME_HEAD:			return this.head;
				case this.NAME_BODY:			return this.body;
				case this.NAME_WAIST:			return this.waist;
				case this.NAME_LEFTARM:			return this.leftArm;
				case this.NAME_LEFTFOREARM:		return this.leftForearm;
				case this.NAME_LEFTHAND:		return this.leftHand;
				case this.NAME_RIGHTARM:		return this.rightArm;
				case this.NAME_RIGHTFOREARM:	return this.rightForearm;
				case this.NAME_RIGHTHAND:		return this.rightHand;
				case this.NAME_LEFTLEG:			return this.leftLeg;
				case this.NAME_LEFTFORELEG:		return this.leftForeleg;
				case this.NAME_LEFTFOOT:		return this.leftFoot;
				case this.NAME_RIGHTLEG:		return this.rightLeg;
				case this.NAME_RIGHTFORELEG:	return this.rightForeleg;
				case this.NAME_RIGHTFOOT:		return this.rightFoot;
				}
				return null;
			}

			getObject() { return this.doll; }
			move(part, command, delta) {
				switch (command) {
				case 'MX': this.doll.position.x = delta; return;
				case 'MY': this.doll.position.y = delta; return;
				case 'MZ': this.doll.position.z = delta; return;
				}
			}
			movePart(partName, command, delta) {
				const part = this.getPart(partName);
				if (part === null) { return; }
				switch (command) {
				case 'RX': part.rotation.x = delta; return;
				case 'RY': part.rotation.y = delta; return;
				case 'RZ': part.rotation.z = delta; return;
				}
			}
			getPartParameter(partName) {
				const part = this.getPart(partName);
				if (part === null) { return null; }
				return {name: partName, rx: part.rotation.x, ry: part.rotation.y, rz: part.rotation.z};
			}
			getMoveParameter() { return {name: this.NAME_DOLL, mx: this.doll.position.x, my: this.doll.position.y, mz: this.doll.position.z}; }
			getAllParameter() {
				const data = [];
				for (let i = 0; i < this.data.length; ++i) {
					const label = this.data[i].label;
					data.push(this.getPartParameter(label));
				}
				data.push(this.getMoveParameter());
				return data;
			}
			setAllParameter(param) {
				param.forEach((data) => {
					if (data.name === this.NAME_DOLL) {
						this.doll.position.set(data.mx, data.my, data.mz);
					}
					else {
						const part = this.getPart(data.name);
						if (part !== null) { part.rotation.set(data.rx, data.ry, data.rz); }
					}
				});
			}
			getAllParameterDiff(param) {
				const result = [];
				param.forEach((data) => {
					if (data.name === this.NAME_DOLL) {
						result.push({name: data.name, mx: data.mx - this.doll.position.x, my: data.my - this.doll.position.y, mz: data.mz - this.doll.position.z});
					}
					else {
						const part = this.getPart(data.name);
						if (part !== null) { result.push({name: data.name, rx: data.rx - part.rotation.x, ry: data.ry - part.rotation.y, rz: data.rz - part.rotation.z}); }
					}
				});
				return result;
			}
			addAllParameter(param, delta) {
				param.forEach((data) => {
					if (data.name === this.NAME_DOLL) {
						this.doll.position.set(this.doll.position.x + data.mx*delta, this.doll.position.y + data.my*delta, this.doll.position.z + data.mz*delta);
					}
					else {
						const part = this.getPart(data.name);
						if (part !== null) { part.rotation.set(part.rotation.x + data.rx*delta, part.rotation.y + data.ry*delta, part.rotation.z + data.rz*delta); }
					}
				});
			}
		}
		
		const dolls = [];
		const schedulers = [];
		let playScale = 0;

		const scene = new THREE.Scene();
		function addLights(scene) {
			const directionLight = new THREE.DirectionalLight(0xffffff, 3);
			directionLight.position.set(1,1,1);
			scene.add(directionLight);
			const ambientLight = new THREE.AmbientLight(0x999999, 2);
			scene.add(ambientLight);
		}
		addLights(scene);
		
		[[0, 0, 3]].forEach(([x,y,z]) => {
			const doll = new Doll();
			const g = new THREE.Group();
			g.add(doll.getObject());
			g.position.set(x, y, z);
			g.rotation.set(0, Math.PI, 0);
			scene.add(g);
			dolls.push(doll);

			const scheduler = new Scheduler(doll);
			const scenario = structuredClone(_scenario);
			scheduler.setScenario(scenario);
			schedulers.push(scheduler);
		});
		[[-2, 0, 1], [0, 0, 1], [2, 0, 1],	[-2, 0, -1], [0, 0, -1], [2, 0, -0.5],	[-2, 0,-3], [0, 0,-3], [2, 0,-3]].forEach(([x,y,z]) => {
			const doll = new Doll();
			const g = new THREE.Group();
			g.add(doll.getObject());
			g.position.set(x, y, z);
			scene.add(g);
			dolls.push(doll);

			const scheduler = new Scheduler(doll);
			const scenario = structuredClone(_scenario);
			scenario[0].wait += 20;
			scheduler.setScenario(scenario);
			schedulers.push(scheduler);
		});
		
		console.log(dolls);
		const ground = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 8), new THREE.MeshStandardMaterial({color: 0x806020}));
		ground.position.y = -0.05;
		scene.add(ground);
		
		const camera = new THREE.PerspectiveCamera(60, getWidth()/getHeight(), 0.1, 1000);
		camera.layers.enable(1);
		camera.position.set(1, 2, 5);
		const renderer = new THREE.WebGLRenderer();
		renderer.setSize(getWidth(), getHeight());
		renderer.setClearColor(0xa0a0ff);
		
		const controls = new OrbitControls(camera, renderer.domElement);
		Object.assign(controls, {rotateSpeed: 0.5, enableDamping: true, dampingFactor: 0.05});
		controls.target.set(0,0.7,0);
		canvas.appendChild(renderer.domElement);
		controls.update();
		
		window.addEventListener("resize", () => {
			camera.aspect = getWidth() / getHeight();
			camera.updateProjectionMatrix();
			renderer.setSize(getWidth(), getHeight());
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.render(scene, camera);
		});

		document.getElementById('play').addEventListener('click', () => {
			playScale = 0;
			schedulers.forEach((sheduler) => sheduler.run(0));
		});
		document.getElementById('fast').addEventListener('click', () => {
			playScale = Math.max(-2, playScale-1);
			schedulers.forEach((sheduler) => sheduler.setScale(playScale));
		});
		document.getElementById('slow').addEventListener('click', () => {
			playScale = Math.min(2, playScale+1);
			schedulers.forEach((sheduler) => sheduler.setScale(playScale));
		});
		document.getElementById('pause').addEventListener('click', () => {
			schedulers.forEach((sheduler) => sheduler.pause());
		});
		document.getElementById('stop').addEventListener('click', () => {
			schedulers.forEach((sheduler) => sheduler.stop());
		});
		

		function animate() {
			renderer.setSize(getWidth(), getHeight());
			renderer.render(scene, camera);
			
			schedulers.forEach((sheduler) => sheduler.animate());
			
			requestAnimationFrame(animate);
		}

		animate();
		</script>
