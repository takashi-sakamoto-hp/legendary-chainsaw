		class Scheduler {
			setScenario(scenario) {
				this.scenario = scenario;
				this.index = -1;
			}
			setListener(listener) { this.listener = listener; }
			isRunning() { return this.index >= 0; }
			getDiffPattern(target, source) {
				const result = [];
				target.forEach((elem1) => {
					if (elem1.name !== 'doll') { 
						const elem2 = source.find(item => item.name === elem1.name);
						result.push(Object.fromEntries(Object.keys(elem1).map(key => [key, (typeof elem1[key] === 'number')?(elem1[key]-elem2[key]):elem1[key]])));
					}
				});
				return result;
			}
			getDiffPatterns(targets, sources) {
				const results = [];
				for (let i = 0; i < targets.length; ++i) { results.push(this.getDiffPattern(targets[i], sources[i])); }
				return results;
			}
			setIndex(no) {
				this.index = no;
				this.listener?.('index', this.index);
				if (this.index < 0) { return; }
				this.pattern		= this.scenario[this.index].pattern;
				this.durationTime	= Math.max(1, Math.floor(this.scenario[this.index].duration * 2**this.scale));
				this.waitTime		= Math.max(0, Math.floor(this.scenario[this.index].wait * 2**this.scale));
				this.diffPattern	= (this.scenario[this.index].pattern.every(Array.isArray))
					?this.getDiffPatterns(this.scenario[this.index].pattern, this.object.getAllParameter())
					:this.getDiffPattern(this.scenario[this.index].pattern, this.object.getAllParameter())
				this.diffDuration	= this.durationTime;
			}
			setScale(scale) { this.scale = scale; }
			run(no) {
				if (no < 0) { return; }
				while (no < this.scenario.length) {
					if (this.scenario[no].checked === true) { break; }
					++no;
				}
				if (no >= this.scenario.length) { return; }
				this.setIndex(no);
				this.scale = 0;
				this.pausing = false;
			}
			next() {
				let next = -1;
				for (let i = this.index+1; i < this.scenario.length; ++i) {
					if (this.scenario[i].checked) { next = i; break; }
				}
				this.setIndex(next);
			}
			stop() { this.setIndex(-1); }
			pause() { this.pausing = !this.pausing; }
			constructor(object) {
				this.object = object;
				this.scale = 0;
				this.pausing = false;
			}
			setPattern(pattern) { this.object.setAllParameter(pattern); }
			animate() {
				if (!this.isRunning() || this.pausing) { return; }
				if (this.durationTime > 0) {
					--this.durationTime;
					if (this.durationTime == 0)	{ this.object.setAllParameter(this.pattern); }
					else						{ this.object.addAllParameter(this.diffPattern, 1/this.diffDuration); }
					this.listener?.('object');
				}
				else if (this.waitTime > 0) { --this.waitTime; }
				else if (this.waitTime == 0) { this.next(); }
			}
		}
		
		class Animatable {
			getDefaultPartName() { throw new Error('getDefaultPart() must be implemented'); }
			getPart(name) { throw new Error('getPart(name) must be implemented'); }
			getObject() { throw new Error('getObject() must be implemented');  }
			getPartParameterRaw(partName) {
				const part = this.getPart(partName);
				if (part === null) { return null; }
				return {
					name: partName,
					rx: part.rotation.x/Math.PI*180,
					ry: part.rotation.y/Math.PI*180,
					rz: part.rotation.z/Math.PI*180,
					mx: part.position.x*100,
					my: part.position.y*100,
					mz: part.position.z*100
				};
			}
			setDefault(partNames) {
				this.partMap = new Map();
				partNames.forEach((partName) => {
					const param = this.getPartParameterRaw(partName);
					if (param !== null) { this.partMap.set(param.name, param); }
				});
			}
			
			movePart(partName, command, delta) {
				const part = this.getPart(partName);
				if (part === null) { return; }
				switch (command) {
				case 'RX': part.rotation.x = (delta + this.partMap.get(partName).rx)/180*Math.PI; return;
				case 'RY': part.rotation.y = (delta + this.partMap.get(partName).ry)/180*Math.PI; return;
				case 'RZ': part.rotation.z = (delta + this.partMap.get(partName).rz)/180*Math.PI; return;
				case 'MX': part.position.x = (delta + this.partMap.get(partName).mx)/100; return;
				case 'MY': part.position.y = (delta + this.partMap.get(partName).my)/100; return;
				case 'MZ': part.position.z = (delta + this.partMap.get(partName).mz)/100; return;
				}
			}
			getPartParameter(partName) {
				const part = this.getPart(partName);
				if (part === null) { return null; }
				return {
					name: partName,
					rx: part.rotation.x/Math.PI*180 - this.partMap.get(partName).rx,
					ry: part.rotation.y/Math.PI*180 - this.partMap.get(partName).ry,
					rz: part.rotation.z/Math.PI*180 - this.partMap.get(partName).rz,
					mx: part.position.x*100 - this.partMap.get(partName).mx,
					my: part.position.y*100 - this.partMap.get(partName).my,
					mz: part.position.z*100 - this.partMap.get(partName).mz
				};
			}
			getAllParameter() {
				const data = [];
				for (let i = 0; i < this.data.length; ++i) { data.push(this.getPartParameter(this.data[i])); }
				return data;
			}
			setAllParameter(param) {
				param.forEach((data) => {
					const part = this.getPart(data.name);
					if (part === null) { return; }
					part.rotation.set(
						(data.rx + this.partMap.get(data.name).rx)/180*Math.PI,
						(data.ry + this.partMap.get(data.name).ry)/180*Math.PI,
						(data.rz + this.partMap.get(data.name).rz)/180*Math.PI
					);
					part.position.set(
						(data.mx + this.partMap.get(data.name).mx)/100,
						(data.my + this.partMap.get(data.name).my)/100,
						(data.mz + this.partMap.get(data.name).mz)/100
					);
				});
			}
			getAllParameterDiff(param) {
				const result = [];
				param.forEach((data) => {
					const part = this.getPart(data.name);
					if (part === null) { return; }
					result.push({
						name: data.name,
						rx: data.rx/180*Math.PI - part.rotation.x - this.partMap.get(data.name).rx,
						ry: data.ry/180*Math.PI - part.rotation.y - this.partMap.get(data.name).ry,
						rz: data.rz/180*Math.PI - part.rotation.z - this.partMap.get(data.name).rz,
						mx: data.mx/100 - part.position.x - this.partMap.get(data.name).mx,
						my: data.my/100 - part.position.y - this.partMap.get(data.name).my,
						mz: data.mz/100 - part.position.z - this.partMap.get(data.name).mz
					});
				});
				return result;
			}
			addAllParameter(param, delta) {
				param.forEach((data) => {
					const part = this.getPart(data.name);
					if (part === null) { return; }
					part.rotation.set(
						part.rotation.x + data.rx*delta/180*Math.PI,
						part.rotation.y + data.ry*delta/180*Math.PI,
						part.rotation.z + data.rz*delta/180*Math.PI
					);
					part.position.set(
						part.position.x + data.mx*delta/100,
						part.position.y + data.my*delta/100,
						part.position.z + data.mz*delta/100
					);
				});
			}
		}

		class Doll extends Animatable {
			#debug = false;

			createTextureFace() {
				const canvas = document.createElement('canvas');
				canvas.width = 512;
				canvas.height = 256;
				const ctx = canvas.getContext('2d');
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				ctx.beginPath();
				ctx.ellipse(100, 128, 17, 10, 0, 0, Math.PI*2);
				ctx.ellipse(156, 128, 17, 10, 0, 0, Math.PI*2);
				ctx.fillStyle = '#202020';
				ctx.fill();

				ctx.beginPath();
				ctx.ellipse(128, 160, 40, 30, 0, 0.3, Math.PI-0.3);
				ctx.fillStyle = '#ff2020';
				ctx.fill();
				
				ctx.beginPath();
				ctx.moveTo(  0,   0);
				ctx.lineTo(  0, 150);
				ctx.lineTo(100,  85);
				ctx.lineTo(156, 100);
				ctx.lineTo(256, 130);
				ctx.lineTo(384, 210);
				ctx.lineTo(512, 150);
				ctx.lineTo(512,   0);
				ctx.closePath();
				ctx.fillStyle = '#202020';
				ctx.fill();

				const texture = new THREE.CanvasTexture(canvas);
				return texture;
			}
			createTextureFB(offset=0, point=80) {
				const canvas = document.createElement('canvas');
				canvas.width = 512;
				canvas.height = 256;
				const ctx = canvas.getContext('2d');
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.font = `bold ${point}px sans-serif`;
				ctx.fillStyle = '#000';
				ctx.fillText('前', canvas.width*1/4, canvas.height/2+offset); 
				ctx.fillText('後', canvas.width*3/4, canvas.height/2+offset); 
				const texture = new THREE.CanvasTexture(canvas);
				return texture;
			}
			createTextureIO() {
				const canvas = document.createElement('canvas');
				canvas.width = 512;
				canvas.height = 256;
				const ctx = canvas.getContext('2d');
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				ctx.font = 'bold 80px sans-serif';
				ctx.fillStyle = '#000';
				ctx.fillText('内', canvas.width*1/4, canvas.height/2); 
				ctx.fillText('外', canvas.width*3/4, canvas.height/2); 
				const texture = new THREE.CanvasTexture(canvas);
				return texture;
			}

				mat.map = (this.#debug)?this.createTextureFB():this.createTextureFace();

				const g = new THREE.Group();
				const m1 = new THREE.Mesh(new THREE.SphereGeometry(0.16), mat);
				m1.name = name;
				m1.scale.set(0.8,1.0,0.9);
				m1.position.y = 0.16;
				const m2 = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.1), this.skin);
				m2.name = name;
				m2.scale.set(1,1,0.8);
				m2.rotation.z = Math.PI/2+0.1;
				m2.position.set(-0.085, 0.14, 0.02);

			createTextureFace() {
				const canvas = document.createElement('canvas');
				canvas.width = 512;
				canvas.height = 256;
				const ctx = canvas.getContext('2d');
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				ctx.beginPath();
				ctx.ellipse(100, 128, 17, 10, 0, 0, Math.PI*2);
				ctx.ellipse(156, 128, 17, 10, 0, 0, Math.PI*2);
				ctx.fillStyle = '#202020';
				ctx.fill();

				ctx.beginPath();
				ctx.ellipse(128, 160, 40, 30, 0, 0.3, Math.PI-0.3);
				ctx.fillStyle = '#ff2020';
				ctx.fill();
				
				ctx.beginPath();
				ctx.moveTo(  0,   0);
				ctx.lineTo(  0, 150);
				ctx.lineTo(100,  85);
				ctx.lineTo(156, 100);
				ctx.lineTo(256, 130);
				ctx.lineTo(384, 210);
				ctx.lineTo(512, 150);
				ctx.lineTo(512,   0);
				ctx.closePath();
				ctx.fillStyle = '#202020';
				ctx.fill();

				const texture = new THREE.CanvasTexture(canvas);
				return texture;
			}

			function getOtherTable() {

				const saveButton = createElement('button', [['id', 'save']], 'Save');
				saveButton.addEventListener('click', async () => {
					if (scheduler.isRunning()) { return; }
					const scenario = getScenario();
					let json = `{\n  "version": 2,\n  "data": [`;
					for (let i = 0; i < scenario.length; ++i) {
						json += '\n    ' + JSON.stringify(scenario[i], (key, value) => { return (typeof value === 'number')?Math.round(value*100)/100:value; });
						if (i !== scenario.length-1) { json += ','; }
					}
					json += `\n  ]\n}`;
					const handle = await window.showSaveFilePicker({suggestedName: "doll.json", types: [{accept: {"application/json": [".json"]}}]});
					const writable = await handle.createWritable();
					await writable.write(json);
					await writable.close();
				});
				td1.append(saveButton);
				td1.append(' ');
				
				const loadButton = createElement('button', [['id', 'load']], 'Load');
				loadButton.addEventListener('click', async () => {
					function update0_1(json) {
						function update(pattern) {
							// radian -> degree, m -> cm
							for (let key in pattern) {
								if		(key === 'rx' || key === 'ry' || key === 'rz') { pattern[key] = Math.trunc(Number(pattern[key])/Math.PI*180); }
								else if (key === 'mx' || key === 'my' || key === 'mz') { pattern[key] = Math.trunc(Number(pattern[key])*100); }
							}
						}
						
						for (let i = 0; i < Math.min(MAX_SCENARIO_LINE, json.data.length); ++i) {
							const line = json.data[i];
							if (line.pattern.every(Array.isArray)) {
								line.pattern.forEach((patternSet) => { patternSet.forEach((pattern) => update(pattern)); });
							}
							else { line.pattern.forEach((pattern) => update(pattern)); }
						}
					}
					function update1_2(json) {
						// add mx, my, mz for each parts, remove doll and mx,my,mz to waist
						function update(patternSet) {
							let dollIndex = -1;
							patternSet.forEach((pattern, index) => {
								if (pattern.name.endsWith('doll')) { dollIndex = index; }
							});
							if (dollIndex < 0) { throw new Error('format error'); }
							patternSet.forEach((pattern) => {
								if (pattern.name.endsWith('waist')) {
									pattern['mx'] = patternSet[dollIndex]['mx'];
									pattern['my'] = patternSet[dollIndex]['my'];
									pattern['mz'] = patternSet[dollIndex]['mz'];
								}
								else {
									pattern['mx'] = 0;
									pattern['my'] = 0;
									pattern['mz'] = 0;
								}
							});
							patternSet.splice(dollIndex, 1);
						}
						
						for (let i = 0; i < Math.min(MAX_SCENARIO_LINE, json.data.length); ++i) {
							const line = json.data[i];
							if (line.pattern.every(Array.isArray)) { line.pattern.forEach((patternSet) => update(patternSet)); }
							else { update(line.pattern); }
						}
						
					}
					if (scheduler.isRunning()) { return; }
					const [handle] = await window.showOpenFilePicker({types: [{description: "JSON Files", accept: {"application/json": [".json"]}}], multiple: false});
					const file = await handle.getFile();
					const json = JSON.parse(await file.text());
					const version = json.version??'0';
					
					if		(version === 0) { update0_1(json); update1_2(json); }
					else if (version === 1) { update1_2(json); }

					for (let i = 0; i < MAX_SCENARIO_LINE; ++i) { setScenarioData(i, getDefaultData()); }
					let initPattern = null;
					for (let i = 0; i < Math.min(MAX_SCENARIO_LINE, json.data.length); ++i) {
						const line = json.data[i];
						setScenarioData(i, {checked: line.checked, pattern: line.pattern, duration: line.duration, wait: line.wait});
						if (line.checked && initPattern === null) { initPattern = line.pattern; }
					}
					editIndex = -1;
					scheduler.setPattern(initPattern);
				});

				function getTexture() {
					const canvas = document.createElement('canvas');
					canvas.width  = 2048;
					canvas.height =  256;
					const ctx = canvas.getContext('2d');
					ctx.clearRect(0, 0, canvas.width, canvas.height);

					ctx.strokeStyle = '#111111';
					ctx.lineWidth = 1;

					ctx.beginPath();
					for (let x = 0; x <= 95; ++x)	{ ctx.moveTo(x*canvas.width/95, 0); ctx.lineTo(x*canvas.width/95, canvas.height); }
					for (let y = 0; y <= 10; ++y)	{ ctx.moveTo(0, y*canvas.height/10); ctx.lineTo(canvas.width, y*canvas.height/10); }
					ctx.stroke();
					
					ctx.fillStyle = '#ffffff';
					ctx.fillRect(0, 0, canvas.width, 15);
					ctx.fillRect(0, canvas.height-10, canvas.width, 10);
					return new THREE.CanvasTexture(canvas);
				}
				const g = new THREE.Group();
				const texture = getTexture();
				const mat = new THREE.MeshStandardMaterial({color: 0xffffff, map: texture, transparent: true,side: THREE.DoubleSide});
				const net = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 1), mat);
				net.rotation.y = Math.PI/2;
				net.position.y = 2.43 - 0.5;
				const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.55), new THREE.MeshStandardMaterial({color: 0xc0c0c0, metalness: 0.7, roughness: 0.1}));
				const pole2 = pole1.clone();
				pole1.position.set(0, 2.55/2, -5);
				pole2.position.set(0, 2.55/2,  5);
				g.add(net, pole1, pole2);
				return g;
			}
			function getField() {
				function getTexture() {
					const canvas = document.createElement('canvas');
					const [W, H, OFFSET] = [1800, 900, 300];
					canvas.width  = W+OFFSET*2;
					canvas.height = H+OFFSET*2;
					const ctx = canvas.getContext('2d');
					ctx.fillStyle = '#e05010';
					ctx.fillRect(0, 0, canvas.width, canvas.height);

					ctx.beginPath();
					ctx.moveTo(OFFSET,		OFFSET);
					ctx.lineTo(OFFSET+W,	OFFSET);
					ctx.lineTo(OFFSET+W,	OFFSET+H);
					ctx.lineTo(OFFSET,		OFFSET+H);
					ctx.closePath();

					ctx.moveTo(OFFSET+W*1/3, OFFSET);
					ctx.lineTo(OFFSET+W*1/3, OFFSET+H);
					ctx.moveTo(OFFSET+W*2/3, OFFSET);
					ctx.lineTo(OFFSET+W*2/3, OFFSET+H);

					ctx.strokeStyle = '#ffffff';
					ctx.lineWidth = 5;
					ctx.stroke();

					return new THREE.CanvasTexture(canvas);
				}
				const texture0 = new THREE.MeshStandardMaterial({color: 0x202020});
				const texture1 = new THREE.MeshStandardMaterial({color: 0xffffff, map: getTexture()});
				const field = new THREE.Mesh(new THREE.BoxGeometry(18+3*2, 0.1, 9+3*2), [texture0, texture0, texture1, texture0, texture0, texture0]);
				return field;
			}
			const court = new THREE.Group();
			const field = getField();
			field.position.y = -0.05;
			const net = getNet();
