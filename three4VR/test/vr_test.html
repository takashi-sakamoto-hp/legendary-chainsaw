<!DOCTYPE html>
<html lang="ja" class="notranslate" translate="no">
	<head>
		<style>
		#canvas		{ position: absolute; top: 0px; left: 0px; z-index: 0; }
		</style>
		<script type="importmap">
		{
		  "imports": {
			"three": "https://unpkg.com/three@0.164.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
		  }
		}
		</script>
	</head>
	<body>
		<div id="canvas" style="width: 100%; height: 100%;"></div>
		<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

		const canvas = document.querySelector('#canvas');
		function getWidth()  { return canvas.getBoundingClientRect().width; }
		function getHeight() { return canvas.getBoundingClientRect().height; }

		class Snake {
			#baseGeometry = null;
			#object = null;
			#time = 0;
			#length = 20;
			#freq = 8;
			#amp = 1;
			getObject() { return this.#object; }
			changeGeometry(geometry) {
				const arr = geometry.attributes.position.array;
				const L = this.#length;
				const HL = L/32;
				for (let i = 0; i < arr.length; i += 3) {
					let [x,y,z] = [arr[i], arr[i+1], arr[i+2]];
					let [dx, dz] = [1, 1];
					if (y < -(L/2-HL)) {
						const dd = Math.sin(Math.PI/2*(y+L/2)/HL);
						[dx, dz] = [dd*1.2, dd];
					}
					else if (y > 0) {
						const dd = Math.sin(Math.PI/2*(1-y*2/L));
						[dx, dz] = [dd, dd];
					}
					[arr[i], arr[i+1], arr[i+2]] = [x*dx, y, z*dz];
				}
				geometry.computeVertexNormals();
				return geometry;
			}
			animateGeometry(offset) {
				const geometry = this.#baseGeometry.clone();
				const arr = geometry.attributes.position.array;
				const L = this.#length;
				for (let i = 0; i < arr.length; i += 3) {
					let [x,y,z] = [arr[i], arr[i+1], arr[i+2]];
					const dx = (Math.sin(Math.PI*2*y/L*4-offset)*(1-y/L)*L/30)*this.#amp;
					[arr[i], arr[i+1], arr[i+2]] = [x+dx, y, z];
				}
				geometry.computeVertexNormals();
				this.#object.geometry.dispose();
				this.#object.geometry = geometry;
			}
			constructor(length = 20, color = 0xc0b0a0, freq = 8, amp = 1) {
				this.#length = length;
				this.#time = 0;
				this.#baseGeometry = this.changeGeometry(new THREE.CylinderGeometry(this.#length/60, this.#length/60, this.#length, 16, 64));
				this.#object = new THREE.Mesh(this.#baseGeometry, new THREE.MeshStandardMaterial({color: color, metalness: 0.5, roughness: 0.3}));
				this.#object.rotation.z = Math.PI/2;
				this.#freq = freq;
				this.#amp = amp;
			}
			animate() {
				++this.#time;
				this.animateGeometry(this.#time/this.#freq);
			}
		}
		const scene = new THREE.Scene();
		const snakes = [];
		for (let i = 0; i < 30; ++i) {
			const color = Math.floor(Math.random()*0x1000000);
			const snake = new Snake(10+10*Math.random(), color, 6 + 5*Math.random(), 0.5+Math.random()*1.3);
			const obj = snake.getObject();
			obj.position.set((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20); 
			scene.add(obj);
			snakes.push(snake);
		}
		const directionLight = new THREE.DirectionalLight(0xffffff, 3);
		directionLight.position.set(1, 1, 1);
		scene.add(directionLight);
		scene.add(new THREE.AmbientLight(0x999999, 2));
		const camera = new THREE.PerspectiveCamera(50, getWidth()/getHeight(), 0.1, 1000);
		camera.position.set(0, 0, 30);
		const renderer = new THREE.WebGLRenderer();
		renderer.setSize(getWidth(), getHeight());
		renderer.setClearColor(0xdddddd);
		renderer.render(scene, camera);
		canvas.appendChild(renderer.domElement);
		const controls = new OrbitControls(camera, renderer.domElement);
		controls.update();

		function animate() {
			renderer.setSize(getWidth(), getHeight());
			renderer.render(scene, camera);
			snakes.forEach((snake) => snake.animate());
		}
		renderer.setAnimationLoop(animate);
		</script>
	</body>
</html>
