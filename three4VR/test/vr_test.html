<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Google Cardboard VR Demo (Three.js)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #007bff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
  
  <!-- ES Modulesのインポートマップ定義 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <button id="vr-button">VRモード開始 (センサー許可)</button>

  <script type="module">
    import * as THREE from 'three';
    import { StereoEffect } from 'three/addons/effects/StereoEffect.js';
    import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, effect, controls;
    let isVRMode = false;

    init();
    animate();

    function init() {
      // 1. シーンの作成
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101020);

      // 2. カメラの作成
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0); // 人間の視点の高さ (約1.6m)

      // 3. レンダラーとStereoEffect（2画面分割）の設定
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      effect = new StereoEffect(renderer);
      effect.setSize(window.innerWidth, window.innerHeight);

      // 4. フォールバック用コントロール（PC・非VR時のPC/スマホ手動操作）
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false;

      // 5. ライティング
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 6. グリッド床と空間オブジェクトの配置
      const grid = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
      scene.add(grid);

      // 周囲にランダムな箱を配置
      const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      for (let i = 0; i < 40; i++) {
        const material = new THREE.MeshStandardMaterial({
          color: Math.random() * 0xffffff,
          roughness: 0.4
        });
        const box = new THREE.Mesh(geometry, material);
        
        // プレイヤーの周囲に分散
        box.position.x = (Math.random() - 0.5) * 20;
        box.position.y = Math.random() * 3 + 0.5;
        box.position.z = (Math.random() - 0.5) * 20;

        scene.add(box);
      }

      // イベントリスナー
      window.addEventListener('resize', onWindowResize);
      document.getElementById('vr-button').addEventListener('click', startVR);
    }

    // 7. VRモード起動とセンサーアクセス許可処理
    async function startVR() {
      const btn = document.getElementById('vr-button');

      // iOS (Safari) 向けのセンサー許可確認
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            alert('ジャイロセンサーの利用が拒否されました。');
            return;
          }
        } catch (e) {
          console.error(e);
        }
      }

      // ジャイロコントロールに切り替え
      controls.dispose();
      controls = new DeviceOrientationControls(camera);
      isVRMode = true;

      // フルスクリーン化（Android等）
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      btn.style.display = 'none'; // ボタンを非表示にする
    }

    // 画面リサイズ処理
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      if (isVRMode) {
        effect.setSize(window.innerWidth, window.innerHeight);
      } else {
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    }

    // アニメーションループ
    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      if (isVRMode) {
        effect.render(scene, camera); // 左右2画面分割描画
      } else {
        renderer.render(scene, camera); // 通常描画
      }
    }
  </script>
</body>
</html>
